name: vikshep-sim
channels:
  - conda-forge
  - nodefaults
# Exact versions of everything that affects the build or the tests. The files conda-linux-64.lock
# and conda-osx-arm64.lock pin the complete environment (every package, build string and hash)
# and are what CI installs from; see README.md, "Lock files", for how to refresh them.
# Platform specific packages (the compilers: clang on macOS, gcc on Linux) come in through
# cxx-compiler and are fixed by the lock files, not named here.
dependencies:
  - geant4=11.4.3=*noqt*
  - cmake=4.4.4
  - ninja=1.13.2
  - cxx-compiler=2.0.0
  - cli11=2.7.2
  - nlohmann_json=3.12.0
  - python=3.15.1
  - expat=2.8.5
  - zlib=1.3.2
  - freetype=2.14.3
  - catch2=3.16.1
  - jsonschema=4.26.0
  - pyarrow=25.0.0
  - numpy=2.5.4
  - matplotlib=3.11.2

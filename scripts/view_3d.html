<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vikshep-sim 3-D export viewer</title>
<!--
  A local page to LOOK at the 3-D export of `vikshep-sim run --export-3d` (docs/EXPORT3D.md):
  geometry.glb and trajectories.json. It is not the Studio viewer.

  three.js 0.160.0 is loaded from the jsDelivr CDN (exact version, below), so the browser needs
  network access to cdn.jsdelivr.net. Nothing else is fetched and nothing is sent anywhere.
  Each of the seven three.js files has a Subresource Integrity hash (sha384) and crossorigin
  below: in the import map ("integrity", enforced by browsers that support it) and on the
  modulepreload links (integrity and crossorigin attributes). A file that does not match is
  refused and the page shows the error. The hashes are those of the files of the npm package
  three@0.160.0 (the CDN serves the same bytes); to change the version, change the four URLs and
  recompute: openssl dgst -sha384 -binary <file> | openssl base64 -A

  Serve a folder that contains this page and the run folder, then open the page with ?run=<folder>:

      cd <repo>                       # or any folder that holds both
      python3 -m http.server 8000
      http://localhost:8000/scripts/view_3d.html?run=/my_run

  (?run is a URL path to the run folder, relative to the page or starting with /.) Without ?run, or
  to look at a run folder anywhere on disk, use the two file choosers (or drop the files on the
  page): geometry.glb and trajectories.json.

  Frame: the Geant4 global frame, unchanged (docs/EXPORT3D.md section 1). The beam is +z. The
  camera starts on +z looking at the origin, so a tracker barrel is seen end-on. Units: the glb is
  in metres, the trajectories in millimetres; the page scales them by asset.extras.mm_per_unit.
-->
<style>
  :root { color-scheme: light dark; --bg: #f4f5f7; --fg: #1d2330; --panel: #ffffffee; --line: #c8ccd4; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14171d; --fg: #e6e9ef; --panel: #1d222bee; --line: #384050; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
               font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #view { position: fixed; inset: 0; }
  #panel { position: fixed; top: 12px; left: 12px; width: 290px; max-height: calc(100% - 24px); overflow: auto;
           background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  #panel h1 { font-size: 14px; margin: 0 0 6px; }
  #panel fieldset { border: 1px solid var(--line); border-radius: 6px; margin: 8px 0; padding: 6px 8px; }
  #panel legend { padding: 0 4px; font-weight: 600; }
  label { display: block; margin: 2px 0; }
  select, button { font: inherit; }
  .row { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
  .row select { flex: 1; min-width: 0; }
  .note { color: color-mix(in srgb, var(--fg) 70%, transparent); }
  #status { margin: 6px 0 0; }
  #warn { color: #b45309; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  #drop { outline: 2px dashed #6b8bd6; outline-offset: -6px; }
</style>
</head>
<body>
<div id="view"></div>
<div id="panel">
  <h1>vikshep-sim 3-D export</h1>
  <div id="files">
    <div class="row"><span>geometry.glb</span><input id="pick-glb" type="file" accept=".glb"></div>
    <div class="row"><span>trajectories.json</span><input id="pick-json" type="file" accept=".json,application/json"></div>
  </div>
  <div id="status" class="note">Loading...</div>
  <div id="warn"></div>

  <fieldset id="events-box" hidden>
    <legend>Event</legend>
    <div class="row">
      <button id="prev" title="previous event (left arrow)">&lt;</button>
      <select id="event"></select>
      <button id="next" title="next event (right arrow)">&gt;</button>
    </div>
    <div id="event-info" class="note"></div>
    <label><input type="checkbox" id="show-tracks" checked> show trajectories</label>
    <label><input type="checkbox" id="charged-only"> charged only</label>
    <label><input type="checkbox" id="primary-only"> primary only</label>
    <label><input type="checkbox" id="dim-neutral" checked> dim neutral tracks</label>
    <label><input type="checkbox" id="show-points"> vertex points</label>
    <div class="row"><span>track width</span><input id="track-width" type="range" min="1" max="8" step="0.5" value="2.5" style="flex:1"></div>
    <div id="legend">
      <div><span class="swatch" style="background:#ff2bd6"></span>primary (parent_id 0): <b id="n-primary">0</b></div>
      <div><span class="swatch" style="background:#d1342f"></span>negative: <b id="n-neg">0</b>
           <span class="swatch" style="background:#2b6fd6;margin-left:8px"></span>positive: <b id="n-pos">0</b>
           <span class="swatch" style="background:#8a8f98;margin-left:8px"></span>neutral: <b id="n-neu">0</b></div>
      <div class="note">counts of the tracks in the file for this event; the primary is also counted in its charge</div>
    </div>
  </fieldset>

  <fieldset id="volumes-box" hidden>
    <legend>Volumes</legend>
    <label><input type="checkbox" id="show-volumes" checked> show volumes</label>
    <div id="roles"></div>
    <label><input type="checkbox" id="only-sensitive"> sensitive volumes only</label>
    <label><input type="checkbox" id="wireframe"> wireframe</label>
    <div class="row"><span>opacity</span><input id="volume-opacity" type="range" min="0" max="1" step="0.01" value="0.15" style="flex:1"></div>
    <label><input type="checkbox" id="axes" checked> axes (x red, y green, z blue = beam)</label>
  </fieldset>

  <fieldset>
    <legend>View</legend>
    <div class="row">
      <button data-view="z">along z</button>
      <button data-view="x">from +x</button>
      <button data-view="y">from +y</button>
      <button data-view="iso">oblique</button>
    </div>
    <div class="note">drag: orbit, wheel: zoom, right-drag: pan</div>
  </fieldset>
  <div id="meta" class="note"></div>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" },
  "integrity": {
    "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js":
      "sha384-61S/Nu32S3E5+n+KpCOTb2eRYps6fVKm+9Gz1QBvSePFthb46f063Aa/qe/lykFZ",
    "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js":
      "sha384-qlO/ZugKPxAQUAvTlQoo0QECzxJIJySZmCF/DHdb2Xn/hHndFwX/vfUAC9Hbk6LP",

      "sha384-epB9Xs4LhC0LT3tq/nQusGJE1Gxn2aaDSW3t/VKDoeZBvl9/tPqn2Hm0GQgXN0Fw",

      "sha384-HoyMSjfTC9HwQuRWVnmRh6XaXt8ZedLc03GaOyFmHtZNZd56Npb28nD2Km2fbibP",

</script>
<link rel="modulepreload" crossorigin="anonymous"
      href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      integrity="sha384-61S/Nu32S3E5+n+KpCOTb2eRYps6fVKm+9Gz1QBvSePFthb46f063Aa/qe/lykFZ">
<link rel="modulepreload" crossorigin="anonymous"
      href="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js"
      integrity="sha384-qlO/ZugKPxAQUAvTlQoo0QECzxJIJySZmCF/DHdb2Xn/hHndFwX/vfUAC9Hbk6LP">
<link rel="modulepreload" crossorigin="anonymous"
      href="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js"
      integrity="sha384-oxY9vSeh7Mrt5WmhN8xfWoDRnmoW9krEiRBY7vJKaK90jMUidM0fhbUwcblpBgTu">
<link rel="modulepreload" crossorigin="anonymous"
      href="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/utils/BufferGeometryUtils.js"
      integrity="sha384-jHGXS4+FuVOBnZkNme2ury3Ccg5DWDLYK22xX/WGdZCZsjRM4J+3n6Qc4CXx1Hjf">
<link rel="modulepreload" crossorigin="anonymous"
      href="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/lines/LineSegments2.js"
      integrity="sha384-epB9Xs4LhC0LT3tq/nQusGJE1Gxn2aaDSW3t/VKDoeZBvl9/tPqn2Hm0GQgXN0Fw">
<link rel="modulepreload" crossorigin="anonymous"
      href="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/lines/LineSegmentsGeometry.js"
      integrity="sha384-HoyMSjfTC9HwQuRWVnmRh6XaXt8ZedLc03GaOyFmHtZNZd56Npb28nD2Km2fbibP">
<link rel="modulepreload" crossorigin="anonymous"
      href="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/lines/LineMaterial.js"
      integrity="sha384-pnL8jGtvPyBMlYz7fiKoo6kShhYl3fVGbcaK9nwF3h1fcLjWMpiPC1/y7jcn2ysZ">
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

const $ = (id) => document.getElementById(id);
const status = (text) => { $('status').textContent = text; };

// ---------------------------------------------------------------- scene
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
$('view').appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 1e-4, 1e3);
camera.up.set(0, 1, 0);                     // the data frame is not rotated; y is up on screen
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x556070, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(1, 2, 3);
scene.add(sun);
const axes = new THREE.AxesHelper(1);
scene.add(axes);

const volumes = new THREE.Group();          // geometry.glb
const tracks = new THREE.Group();           // the chosen event's trajectories
scene.add(volumes, tracks);

let geometry = null;      // {extras, nodes: [{object, role, sensitive}]}
let trajectories = null;  // parsed trajectories.json
let radius = 1;           // radius of the sphere around the whole geometry, in metres, for the camera
let centre = new THREE.Vector3();   // centre of that sphere
const lineMaterials = [];  // LineMaterial needs the window size in pixels
let currentEvent = 0;

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  for (const m of lineMaterials) m.resolution.set(w, h);
}
window.addEventListener('resize', resize);
resize();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });

// Frames the whole geometry: the camera looks at the centre of the sphere around everything and is
// far enough for that sphere to fit the narrower of the two fields of view.
function setView(name) {
  const half = Math.min(THREE.MathUtils.degToRad(camera.fov) / 2, Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) * camera.aspect));
  const d = 1.15 * radius / Math.sin(half);
  const dir = { z: [0, 0, 1], x: [1, 0, 0], y: [0, 1, 0], iso: [0.7, 0.55, 0.9] }[name];
  const n = Math.hypot(...dir);
  const up = name === 'y' ? [0, 0, -1] : [0, 1, 0];
  camera.up.set(...up);
  camera.position.set(centre.x + dir[0] / n * d, centre.y + dir[1] / n * d, centre.z + dir[2] / n * d);
  controls.target.copy(centre);
  camera.near = d / 1000; camera.far = d * 100;
  camera.updateProjectionMatrix();
  controls.update();
}
document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));

// ---------------------------------------------------------------- geometry
function loadGeometry(buffer) {
  return new Promise((resolve, reject) => {
    new GLTFLoader().parse(buffer, '', (gltf) => {
      volumes.clear();
      const extras = gltf.parser.json.asset.extras || {};
      const nodes = [];
      gltf.scene.traverse((o) => {
        if (o.isMesh) {
          const info = o.userData || {};
          // GLTFLoader puts node extras on the node object; the mesh may be the node itself or its child
          const holder = info.role ? o : o.parent;
          const e = (holder && holder.userData) || {};
          o.material = o.material.clone();
          o.material.depthWrite = false;      // translucent volumes never hide a track
          o.material.transparent = true;
          o.renderOrder = 0;
          nodes.push({ object: o, role: e.role || 'volume', sensitive: !!e.sensitive });
        }
      });
      volumes.add(gltf.scene);
      const box = new THREE.Box3().setFromObject(volumes);
      radius = Math.max(box.getSize(new THREE.Vector3()).length() / 2, 1e-3);
      box.getCenter(centre);
      axes.scale.setScalar(radius * 0.6);
      geometry = { extras, nodes };
      resolve();
    }, reject);
  });
}

function applyVolumeToggles() {
  const all = $('show-volumes').checked;
  const only = $('only-sensitive').checked;
  const roleOn = {};
  document.querySelectorAll('#roles input').forEach((c) => { roleOn[c.dataset.role] = c.checked; });
  for (const n of geometry.nodes) {
    n.object.visible = all && roleOn[n.role] !== false && (!only || n.sensitive);
    n.object.material.wireframe = $('wireframe').checked;
    n.object.material.opacity = Number($('volume-opacity').value);
  }
  axes.visible = $('axes').checked;
}

function buildRoleToggles() {
  const roles = [...new Set(geometry.nodes.map((n) => n.role))];
  $('roles').innerHTML = '';
  for (const role of roles) {
    const count = geometry.nodes.filter((n) => n.role === role).length;
    const label = document.createElement('label');
    label.innerHTML = '<input type="checkbox" checked data-role="' + role + '"> ' + role + ' (' + count + ')';
    $('roles').appendChild(label);
  }
  $('volumes-box').hidden = false;
  ['roles', 'show-volumes', 'only-sensitive', 'wireframe', 'axes'].forEach((id) =>
    $(id).addEventListener('change', applyVolumeToggles));
  $('volume-opacity').addEventListener('input', applyVolumeToggles);
  applyVolumeToggles();
}

// ---------------------------------------------------------------- trajectories
const COLOURS = { primary: 0xff2bd6, neg: 0xd1342f, pos: 0x2b6fd6, neutral: 0x8a8f98 };
const kindOf = (t) => (t.parent_id === 0 ? 'primary' : t.charge < 0 ? 'neg' : t.charge > 0 ? 'pos' : 'neutral');

// One LineSegments2 per kind (thick lines: WebGL's own lines are always one pixel wide), drawn after
// the volumes with the depth test off, so the volumes never hide a track.
function lineObject(kind, positions, width, opacity) {
  const g = new LineSegmentsGeometry();
  g.setPositions(positions);
  const m = new LineMaterial({ color: COLOURS[kind], linewidth: width, transparent: true, opacity, depthTest: false, depthWrite: false });
  m.resolution.set(window.innerWidth, window.innerHeight);
  lineMaterials.push(m);
  const o = new LineSegments2(g, m);
  o.renderOrder = kind === 'primary' ? 12 : kind === 'neutral' ? 10 : 11;
  return o;
}

function showEvent(index) {
  currentEvent = index;
  for (const o of tracks.children) { o.geometry.dispose(); o.material.dispose(); lineMaterials.splice(lineMaterials.indexOf(o.material), 1); }
  tracks.clear();
  const event = trajectories.events[index];
  const scale = 1 / ((geometry && geometry.extras.mm_per_unit) || 1000);   // mm -> glb units (m)
  const width = Number($('track-width').value);
  const chargedOnly = $('charged-only').checked, primaryOnly = $('primary-only').checked;
  const dim = $('dim-neutral').checked;
  const segs = { primary: [], neg: [], pos: [], neutral: [] };
  const pts = [], ptsColour = [];
  const count = { neg: 0, pos: 0, neutral: 0, primary: 0 };
  for (const t of event.tracks) {
    const kind = kindOf(t);
    count[t.charge < 0 ? 'neg' : t.charge > 0 ? 'pos' : 'neutral']++;
    if (t.parent_id === 0) count.primary++;
    if ((chargedOnly && t.charge === 0) || (primaryOnly && t.parent_id !== 0)) continue;
    const c = new THREE.Color(COLOURS[kind]);
    for (let i = 0; i < t.points.length; i++) {
      const p = t.points[i];
      pts.push(p[0] * scale, p[1] * scale, p[2] * scale);
      ptsColour.push(c.r, c.g, c.b);
      if (i > 0) {
        const q = t.points[i - 1];
        segs[kind].push(q[0] * scale, q[1] * scale, q[2] * scale, p[0] * scale, p[1] * scale, p[2] * scale);
      }
    }
  }
  if (segs.neutral.length) tracks.add(lineObject('neutral', segs.neutral, width * 0.7, dim ? 0.18 : 0.9));
  if (segs.neg.length) tracks.add(lineObject('neg', segs.neg, width, 0.95));
  if (segs.pos.length) tracks.add(lineObject('pos', segs.pos, width, 0.95));
  if (segs.primary.length) tracks.add(lineObject('primary', segs.primary, width * 2, 1));
  if (pts.length) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(ptsColour, 3));
    const points = new THREE.Points(g, new THREE.PointsMaterial({ size: 4, sizeAttenuation: false, vertexColors: true, depthTest: false, depthWrite: false }));
    points.renderOrder = 13;
    points.visible = $('show-points').checked;
    points.userData.isPoints = true;
    tracks.add(points);
  }
  $('n-primary').textContent = count.primary; $('n-neg').textContent = count.neg;
  $('n-pos').textContent = count.pos; $('n-neu').textContent = count.neutral;
  const hasPrimary = count.primary;
  $('event-info').textContent = event.tracks.length + ' tracks in the file of ' + event.tracks_total + ' created (' +
    hasPrimary + ' primary)';
  $('warn').textContent = event.dropped_tracks > 0
    ? event.dropped_tracks + ' tracks of this event are not in the file (secondaries below ' +
      trajectories.min_energy_GeV + ' GeV, or beyond the ' + trajectories.max_tracks_per_event + '-track cap). ' +
      'The export is a subset, for viewing.'
    : '';
  tracks.visible = $('show-tracks').checked;
}

function setupTrajectories() {
  const select = $('event');
  select.innerHTML = '';
  trajectories.events.forEach((e, i) => {
    const o = document.createElement('option');
    o.value = i; o.textContent = 'event ' + e.event_id;
    select.appendChild(o);
  });
  $('events-box').hidden = false;
  showEvent(0);
}
$('event').addEventListener('change', (e) => showEvent(Number(e.target.value)));
const step = (d) => {
  if (!trajectories) return;
  const s = $('event'); const n = trajectories.events.length;
  s.value = (Number(s.value) + d + n) % n; showEvent(Number(s.value));
};
$('prev').addEventListener('click', () => step(-1));
$('next').addEventListener('click', () => step(1));
window.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1); });
$('show-tracks').addEventListener('change', () => { tracks.visible = $('show-tracks').checked; });
['charged-only', 'primary-only', 'dim-neutral'].forEach((id) => $(id).addEventListener('change', () => { if (trajectories) showEvent(currentEvent); }));
$('track-width').addEventListener('input', () => { if (trajectories) showEvent(currentEvent); });
$('show-points').addEventListener('change', () => { for (const o of tracks.children) if (o.userData.isPoints) o.visible = $('show-points').checked; });

// ---------------------------------------------------------------- loading
function describe() {
  const parts = [];
  if (geometry) {
    parts.push('template ' + geometry.extras.template + ', ' + geometry.nodes.length + ' volumes, beam axis ' +
      geometry.extras.beam_axis + ', glb unit ' + geometry.extras.length_unit);
  }
  if (trajectories) {
    parts.push(trajectories.events.length + ' events, trajectories in ' + trajectories.unit);
    if (geometry && geometry.extras.spec_oid !== trajectories.spec_oid) {
      parts.push('WARNING: the two files are from different specs');
    }
  }
  $('meta').textContent = parts.join('. ');
  status(geometry || trajectories ? 'Loaded.' : 'Nothing loaded.');
}

async function useGeometry(buffer) { await loadGeometry(buffer); buildRoleToggles(); setView('z'); describe(); if (trajectories) showEvent(Number($('event').value || 0)); }
function useTrajectories(text) {
  trajectories = JSON.parse(text); setupTrajectories(); describe();
  if (!geometry) {   // no geometry.glb: frame the tracks of the first event
    const box = new THREE.Box3().setFromObject(tracks);
    if (!box.isEmpty()) { radius = Math.max(box.getSize(new THREE.Vector3()).length() / 2, 1e-3); box.getCenter(centre); setView('z'); }
  }
}

$('pick-glb').addEventListener('change', async (e) => { if (e.target.files[0]) await useGeometry(await e.target.files[0].arrayBuffer()); });
$('pick-json').addEventListener('change', async (e) => { if (e.target.files[0]) useTrajectories(await e.target.files[0].text()); });
document.body.addEventListener('dragover', (e) => e.preventDefault());
document.body.addEventListener('drop', async (e) => {
  e.preventDefault();
  for (const f of e.dataTransfer.files) {
    if (f.name.endsWith('.glb')) await useGeometry(await f.arrayBuffer());
    else if (f.name.endsWith('.json')) useTrajectories(await f.text());
  }
});

const run = new URLSearchParams(location.search).get('run');
if (run !== null) {
  const base = run.replace(/\/+$/, '') + '/';
  try {
    const g = await fetch(base + 'geometry.glb');
    if (!g.ok) throw new Error('geometry.glb: HTTP ' + g.status + ' (is the run folder under the served directory?)');
    await useGeometry(await g.arrayBuffer());
    const t = await fetch(base + 'trajectories.json');
    if (!t.ok) throw new Error('trajectories.json: HTTP ' + t.status);
    useTrajectories(await t.text());
  } catch (err) {
    status('Could not load ' + base + ': ' + err.message + '. Use the file choosers instead.');
  }
} else {
